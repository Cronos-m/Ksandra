    <style>
        /* 90s Industrial CRT Scanline Overlay */
        body {
            background-color: #070709;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 0),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 50%, rgba(0, 0, 0, 0.5) 51%);
            background-size: 20px 20px, 100% 4px;
            color: #d1d5db;
            font-family: 'Special Elite', 'Courier New', monospace;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 99;
            opacity: 0.6;
        }

        /* Zine Brutalist Borders & Buttons */
        .grunge-box {
            background: #121319;
            border: 2px solid #2a2d3d;
            box-shadow: 4px 4px 0px #000;
        }

        .grunge-btn {
            background: #1a1c26;
            border: 2px solid #2a2d3d;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
        }

        .grunge-btn:hover {
            border-color: #ffb000;
            color: #ffb000;
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px #000;
        }

        .grunge-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .amber-glow { text-shadow: 0 0 8px rgba(255, 176, 0, 0.6); }
        .green-glow { text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }

        /* Anagram Tree Nodes Styling */
        .grp0 {
            width: 48px;
            height: 48px;
            line-height: 44px;
            margin-bottom: 10px;
            margin-right: 10px;
            background-color: #ffb000;
            color: #000;
            font-weight: bold;
            font-family: 'VT323', monospace;
            border: 2px solid #000;
            box-shadow: 3px 3px 0px #000;
            float: left;
            cursor: pointer;
            font-size: 32px;
            text-align: center;
        }
        .grp0:hover {
            background-color: #39ff14;
        }

        .grp1 {
            width: calc(100% - 70px);
            margin-bottom: 10px;
            padding: 12px 16px;
            background-color: #1a1c26;
            border: 2px solid #2a2d3d;
            box-shadow: 3px 3px 0px #000;
            float: left;
            cursor: pointer;
            font-size: 15px;
            line-height: 1.4;
        }

        .grp2 {
            width: 100%;
            margin-bottom: 10px;
            padding: 12px 16px;
            background-color: #1a1c26;
            border: 2px solid #2a2d3d;
            box-shadow: 3px 3px 0px #000;
            clear: both;
            cursor: pointer;
            font-size: 15px;
            line-height: 1.4;
        }

        .grp1:hover, .grp2:hover {
            border-color: #39ff14;
            color: #39ff14;
        }

        .letters { display: none; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070709; }
        ::-webkit-scrollbar-thumb { background: #2a2d3d; border: 1px solid #ffb000; }

        function cleanAccents(str) {
            var map = {'á':'a','à':'a','â':'a','ä':'a','å':'a','ã':'a','ç':'c','é':'e','è':'e','ê':'e','ë':'e','í':'i','ì':'i','î':'i','ï':'i','ñ':'n','ó':'o','ò':'o','ô':'o','ö':'o','õ':'o','ø':'o','š':'s','ú':'u','ù':'u','û':'u','ü':'u','ý':'y','ÿ':'y','ž':'z','æ':'ae','œ':'oe'};
            return str.replace(/[áàâäåãçéèêëíìîïñóòôöõøšúùûüýÿžæœ]/g, function(c) { return map[c] || c; });
        }

        function updateWordCounter() {
            var raw = $("#form").val();
            var words = raw.split(",").map(function(w) { return w.trim(); }).filter(Boolean);
            $("#lbl-word-count").text(words.length + " palabras");
        }

        function buildTree(node) {
            var dict = I18N[currentLang];
            var wordsList = $(node).find("span").map(function() { return $(this).text(); }).get().join(", ").split(",");
            wordsList = wordsList.map(function(w) { return w.trim(); }).filter(Boolean);
            var totalWords = wordsList.length;

            if (totalWords >= 2) {
                if ($(node).children(".letters").length === 0) {
                    var letterTpl = $(".letters").html();
                    $(node).prepend('<div class="letters">' + letterTpl + '</div>');
                } else {
                    $(node).children(".letters").find("h").text("0");
                }

                $.each(wordsList, function(i, word) {
                    var clean = cleanAccents(word.toLowerCase());
                    $(node).children(".letters").find("h").each(function() {
                        var letterClass = $(this).attr("class");
                        if (clean.indexOf(letterClass) >= 0) {
                            var cnt = parseInt($(this).text(), 10) + 1;
                            $(this).html(cnt);
                        }
                    });
                });

                var maxOccur = 0;
                $(node).children(".letters").find("h").each(function() {
                    var val = parseInt($(this).text(), 10);
                    if (val !== totalWords && "used" !== $(this).attr("value")) {
                        maxOccur = maxOccur < val ? val : maxOccur;
                    }
                });

                if (maxOccur === 0) {
                    $(node).children(".letters").find("h").each(function() {
                        var val = parseInt($(this).text(), 10);
                        $(this).attr("value", "notUsed").css("background-color", "transparent");
                        if (val !== totalWords) maxOccur = maxOccur < val ? val : maxOccur;
                    });
                }

                var chosenLetter = "";
                $(node).children(".letters").find("h").each(function() {
                    var val = parseInt($(this).text(), 10);
                    if ("used" !== $(this).attr("value") && val === maxOccur) {
                        chosenLetter = $(this).attr("class");
                        $(this).attr("value", "used").css("background-color", "red");
                        return false;
                    }
                });

                var nodeClass = $(node).attr("class");
                var prevClass = $(node).prev().attr("class");

                if (nodeClass === "grp1" && prevClass === "grp0") {
                    $(node).css({ width: "calc(100% - 60px)", margin: "0", padding: "0", "background-color": "transparent", cursor: "default", border: "none", "box-shadow": "none" });
                } else {
                    $(node).css({ width: "100%", margin: "0", padding: "0", "background-color": "transparent", cursor: "default", border: "none", "box-shadow": "none" });
                }

                $(node).find("span, .grp0, .grp1, .grp2").remove();
                $(node).append("<div class='grp0'>" + chosenLetter.toUpperCase() + "</div><div class='grp1'><span></span></div><div class='grp2'><span></span></div>");

                $.each(wordsList, function(i, word) {
                    var clean = cleanAccents(word.toLowerCase());
                    if (clean.indexOf(chosenLetter) >= 0) {
                        var targetGrp2 = $(node).children(".grp2").find("span");
                        targetGrp2.is(":empty") ? targetGrp2.append(word) : targetGrp2.append(", " + word);
                    } else {
                        var targetGrp1 = $(node).children(".grp1").find("span");
                        targetGrp1.is(":empty") ? targetGrp1.append(word) : targetGrp1.append(", " + word);
                    }
                });

                buildTree($(node).children(".grp2"));
            }
        }

        $(document).ready(function() {
            updateLanguage("ES");

            // Input Counter Listener
            $("#form").on("input", updateWordCounter);

            // Click Language Handlers
            $("#lang-en").click(function() { updateLanguage("EN"); });
            $("#lang-fr").click(function() { updateLanguage("FR"); });
            $("#lang-es").click(function() { updateLanguage("ES"); });

            // Presets Handlers
            $(".preset").click(function() {
                var dict = I18N[currentLang];
                if ($(this).hasClass("astrology")) $("#form").val(dict.astrology_words);
                if ($(this).hasClass("planets")) $("#form").val(dict.planets_words);
                if ($(this).hasClass("days")) $("#form").val(dict.days_words);
                if ($(this).hasClass("months")) $("#form").val(dict.months_words);
                if ($(this).hasClass("animals")) $("#form").val(dict.animals_words);
                if ($(this).hasClass("superheros")) $("#form").val(dict.superheros_words);
                updateWordCounter();
            });

            // Submit / Build Generator
            $("#submit").click(function() {
                var dict = I18N[currentLang];
                var raw = $("#form").val().toLowerCase();
                var words = raw.split(",").map(function(w) { return w.trim(); }).filter(Boolean);

                if (words.length < 2) {
                    alert(dict.alert01);
                    return;
                }

                $("#main").children(".letters").find("h").text("0");

                $.each(words, function(i, word) {
                    var clean = cleanAccents(word);
                    $("#main").children(".letters").find("h").each(function() {
                        var letterClass = $(this).attr("class");
                        if (clean.indexOf(letterClass) >= 0) {
                            var cnt = parseInt($(this).text(), 10) + 1;
                            $(this).html(cnt);
                        }
                    });
                });

                var maxVal = 0;
                $("#main").children(".letters").find("h").each(function() {
                    var val = parseInt($(this).text(), 10);
                    if (val !== words.length) maxVal = maxVal < val ? val : maxVal;
                });

                $("#main").children(".letters").find("h").text("0");

                if (maxVal === 0) {
                    alert(dict.alert02);
                    return;
                }

                $("#result").html("<div class='grp2'><span>" + words.join(", ") + "</span></div>");
                buildTree($("#result").children(".grp2"));

                var errorMargin = parseInt($("#nonumb").val(), 10);
                if (errorMargin >= 2) {
                    $.each($("#result").find(".grp0"), function() {
                        buildTree($(this).next());
                        if (errorMargin >= 3) {
                            $.each($(this).next().find(".grp0"), function() {
                                buildTree($(this).next());
                            });
                        }
                    });
                }

                $("#result, #testsave").removeClass("hidden");
                $("#text, #yesno, #retestgoback").addClass("hidden");
            });

            // Interactive Node Inspection
            $("body").on("click", ".grp0, .grp1, .grp2", function() {
                $("#testsave").removeClass("hidden");
                $("#text, #yesno").addClass("hidden");
                if ($(this).hasClass("grp0")) {
                    buildTree($(this).parent());
                    return false;
                }
                if ($(this).css("background-color") !== "rgba(0, 0, 0, 0)") {
                    buildTree(this);
                    return false;
                }
            });

            // HTML2Canvas Image Export
            $("#save").click(function() {
                var el = document.getElementById("result");
                html2canvas(el, { backgroundColor: "#070709" }).then(function(canvas) {
                    var img = canvas.toDataURL("image/png");
                    var a = document.createElement("a");
                    a.href = img;
                    a.download = "casandra-anagrama.png";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
            });

            // Performance Rehearsal Mode
            $("body").on("click", "#test, #retest", function() {
                var dict = I18N[currentLang];
                etape = $("#result").children(".grp2").children(".grp0");
                var letter = etape.text().toUpperCase();
                $("#script-display").html(dict.sent01a + letter + dict.sent01b);
                $("#result, #testsave, #retestgoback").addClass("hidden");
                $("#text, #yesno").removeClass("hidden");
            });

            // Script Yes Branch
            $("#yes").click(function() {
                var dict = I18N[currentLang];
                if ($(etape).next().next().children().next().hasClass("grp0")) {
                    etape = $(etape).next().next().children(".grp0");
                    var letter = etape.text().toUpperCase();
                    $("#script-display").html(dict.sent02a + letter + dict.sent02b);
                } else {
                    etape = $(etape).next().next().children("span");
                    var words = etape.text().toUpperCase().replace(/,/g, dict.sent00a);
                    $("#script-display").html(dict.sent03a + words + dict.sent03b);
                    $("#yesno").addClass("hidden");
                    $("#retestgoback").removeClass("hidden");
                }
            });

            // Script No Branch
            $("#no").click(function() {
                var dict = I18N[currentLang];
                if ($(etape).next().children().next().hasClass("grp0")) {
                    etape = $(etape).next().children(".grp0");
                    var letter = etape.text().toUpperCase();
                    $("#script-display").html(dict.sent04a + letter + dict.sent04b);
                } else {
                    etape = $(etape).next().children("span");
                    var words = etape.text().toUpperCase().replace(/,/g, dict.sent00a);
                    $("#script-display").html(dict.sent05a + words + dict.sent05b);
                    $("#yesno").addClass("hidden");
                    $("#retestgoback").removeClass("hidden");
                }
            });

            // Back to Diagram
            $("#goback").click(function() {
                $("#result, #testsave").removeClass("hidden");
                $("#text, #retestgoback").addClass("hidden");
            });

            // Keyboard Shortcuts for Live Test Mode
            window.addEventListener('keydown', function(e) {
                if ($("#text").hasClass("hidden")) return;
                if (e.key === 'ArrowRight' || e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'y') {
                    $("#yes").click();
                }
                if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'n') {
                    $("#no").click();
                }
            });

            // Initialize PWA Support
            setupPWA();
        });

        // Dynamic PWA Registration via Blob URIs
        function setupPWA() {
            var manifestData = {
                name: "CASANDRA Progressive Anagram",
                short_name: "CASANDRA",
                start_url: ".",
                display: "standalone",
                background_color: "#070709",
                theme_color: "#070709",
                icons: [{
                    src: "https://placehold.co/192x192/070709/ffb000?text=CASANDRA",
                    sizes: "192x192",
                    type: "image/png"
                }]
            };

            var manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            var manifestURL = URL.createObjectURL(manifestBlob);
            var manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestURL;
            document.head.appendChild(manifestLink);

            if ('serviceWorker' in navigator) {
                var swCode = `
                    const CACHE = 'casandra-anagram-v1';
                    self.addEventListener('install', e => e.waitUntil(caches.open(CACHE)));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                var swBlob = new Blob([swCode], { type: 'application/javascript' });
                var swURL = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swURL).catch(function(){});
            }

            var deferredPrompt = null;
            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
                var installBtn = document.getElementById('pwa-install-btn');
                if (installBtn) {
                    installBtn.classList.remove('hidden');
                    installBtn.onclick = function() {
                        installBtn.classList.add('hidden');
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function(choiceResult) {
                            deferredPrompt = null;
                        });
                    };
                }
            });
        }
    })();
    </script>
