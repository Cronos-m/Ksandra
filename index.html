            theme: {
                extend: {
                    colors: {
                        grunge: {
                            base: '#070709',
                            card: '#121319',
                            border: '#2a2d3d',
                            rust: '#8b0000',
                            crimson: '#c0392b',
                            amber: '#ffb000',

                    },
                    fontFamily: {
                        mono: ['VT323', 'monospace'],
                        typewriter: ['Special Elite', 'Courier New', 'monospace']

            }
        }

    <style>
        /* SCROLL FIXES FOR HTML & BODY */
        html {
            height: -webkit-fill-available;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #070709;
            background-image:
                radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 0),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 50%, rgba(0, 0, 0, 0.5) 51%);
            background-size: 20px 20px, 100% 4px;
            color: #d1d5db;
            font-family: 'Special Elite', 'Courier New', monospace;
            -webkit-overflow-scrolling: touch;
        }

        /* 90s Industrial CRT Scanline Overlay */
        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none !important; /* Touch-through fix */
            z-index: 99;
            opacity: 0.5;
        }

        /* Zine Brutalist Borders & Buttons */
        .grunge-box {
            background: #121319;
            border: 2px solid #2a2d3d;
            box-shadow: 4px 4px 0px #000;
        }

        .grunge-btn {
            background: #1a1c26;
            border: 2px solid #2a2d3d;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
        }

        .grunge-btn:hover {
            border-color: #ffb000;
            color: #ffb000;
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px #000;
        }

        .grunge-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .grunge-btn:focus-visible,
        select:focus-visible,
        #language span:focus-visible {
            outline: 2px solid #ffb000;
            outline-offset: 2px;
        }

        .amber-glow { text-shadow: 0 0 8px rgba(255, 176, 0, 0.6); }
        .green-glow { text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }

        .icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }

        /* Anagram Tree Nodes Styling */
        .grp0 {
            width: 48px;
            height: 48px;
            line-height: 44px;
            margin-bottom: 10px;
            margin-right: 10px;
            background-color: #ffb000;
            color: #000;
            font-weight: bold;
            font-family: 'VT323', monospace;
            border: 2px solid #000;
            box-shadow: 3px 3px 0px #000;
            float: left;
            cursor: pointer;
            font-size: 32px;
            text-align: center;
            user-select: none;
        }
        .grp0:hover {
            background-color: #39ff14;
        }

        .grp1 {
            width: calc(100% - 70px);
            margin-bottom: 10px;
            padding: 12px 16px;
            background-color: #1a1c26;
            border: 2px solid #2a2d3d;
            box-shadow: 3px 3px 0px #000;
            float: left;
            font-size: 15px;
            line-height: 1.4;
        }

        .grp2 {
            width: 100%;
            margin-bottom: 10px;
            padding: 12px 16px;
            background-color: #1a1c26;
            border: 2px solid #2a2d3d;
            box-shadow: 3px 3px 0px #000;
            clear: both;
            font-size: 15px;
            line-height: 1.4;
        }

        /* Nodo ya desplegado: solo contenedor, sin caja propia */
        .grp1.open, .grp2.open {
            margin: 0;
            padding: 0;
            background-color: transparent;
            border: none;
            box-shadow: none;
        }
        .grp1.open { width: calc(100% - 60px); }

        /* Lista final de palabras (hoja). Solo se puede abrir si aún se puede dividir */
        .leaf.expandable { cursor: pointer; }
        .leaf:hover {
            border-color: #39ff14;
            color: #39ff14;
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #070709; }
        ::-webkit-scrollbar-thumb { background: #2a2d3d; border: 1px solid #ffb000; }
    </style>

    <!-- JavaScript & PWA Core Logic -->
    <script>
    (function () {
        'use strict';

        /* ENGINE:START */
        var Engine = (function () {
            'use strict';

            var SPECIAL = { 'ß': 'ss', 'æ': 'ae', 'œ': 'oe', 'ø': 'o', 'ł': 'l', 'đ': 'd' };

            // Quita tildes/diacríticos y pasa a minúsculas ("Ñandú" -> "nandu")
            function clean(str) {
                return str.toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[ßæœøłđ]/g, function (c) { return SPECIAL[c]; });
            }

            // Máscara de 26 bits con las letras a-z presentes en la palabra
            function letterMask(word) {
                var s = clean(word), m = 0;
                for (var i = 0; i < s.length; i++) {
                    var c = s.charCodeAt(i) - 97;
                    if (c >= 0 && c < 26) m |= 1 << c;
                }
                return m;
            }

            // Peso (en "preguntas") de cada opción sobrante en una lista final.
            //  questions: tolera listas más largas a cambio de menos letras
            //  balanced:  compromiso por defecto
            //  options:   prácticamente siempre una única palabra al final
            var PRIORITY = { questions: 1, balanced: 3, options: 12 };

            var FULL_SEARCH_LIMIT = 40000;   // nº de estados explorados con búsqueda completa
            var HARD_SEARCH_LIMIT = 120000;  // a partir de aquí solo se explora la mejor opción
            var EPS = 1e-9;

            /**
             * Crea un resolvedor para una lista de palabras.
             * words: array de strings (únicas)  | lambda: peso de las opciones sobrantes
             */
            function createSolver(words, lambda) {
                var n = words.length;
                var masks = words.map(letterMask);
                var memo = new Map();
                var states = 0;
                var chunkCount = Math.ceil(n / 15);

                var leafCost = function (m) { return lambda * m * (m - 1); };
                var est = function (m) { return m > 1 ? m * Math.log2(m) : 0; };

                function key(S, e, must) {
                    var ch = new Array(chunkCount).fill(0);
                    for (var i = 0; i < S.length; i++) ch[(S[i] / 15) | 0] |= 1 << (S[i] % 15);
                    return e + (must ? 's' : 'n') + String.fromCharCode.apply(null, ch);
                }

                // Letras que separan S (están en algunas palabras pero no en todas)
                function candidateMask(S) {
                    var or = 0, and = 0x3ffffff;
                    for (var i = 0; i < S.length; i++) { or |= masks[S[i]]; and &= masks[S[i]]; }
                    return or & ~and;
                }

                function split(S, k) {
                    var Y = [], N = [];
                    for (var i = 0; i < S.length; i++) (masks[S[i]] >> k & 1 ? Y : N).push(S[i]);
                    return { Y: Y, N: N };
                }

                // Particiones distintas; letters = todas las letras que producen esa misma partición
                function partitions(S) {
                    var cand = candidateMask(S), out = [], seen = new Map();
                    for (var k = 0; k < 26; k++) {
                        if (!(cand >> k & 1)) continue;
                        var sp = split(S, k), sig = key(sp.Y, 0, false);
                        if (seen.has(sig)) { seen.get(sig).letters.push(k); continue; }
                        var p = { letters: [k], Y: sp.Y, N: sp.N };
                        seen.set(sig, p);
                        out.push(p);
                    }
                    return out;
                }

                function branchCost(p, e) {
                    var ry = best(p.Y, e, false);
                    var rn = e > 0 ? best(p.N, e - 1, false) : { cost: leafCost(p.N.length), depth: 0 };
                    return { ry: ry, rn: rn, depth: 1 + Math.max(ry.depth, rn.depth) };
                }

                // Mejor decisión para el grupo S con e "noes" aún refinables.
                // Devuelve { cost, depth, k }  (k = -1 -> lista final de opciones)
                function best(S, e, mustSplit) {
                    var size = S.length;
                    if (size === 1) return { cost: 0, depth: 0, k: -1 };
                    var id = key(S, e, mustSplit);
                    var hit = memo.get(id);
                    if (hit) return hit;

                    var parts = partitions(S), res = null;

                    if (parts.length) {
                        states++;
                        if (states > FULL_SEARCH_LIMIT) {
                            // Búsqueda acotada: solo las partes más prometedoras según una estimación barata
                            var keep = states > HARD_SEARCH_LIMIT ? 1 : 3;
                            parts = parts.map(function (p) {
                                var h = est(p.Y.length) + (e > 0 ? est(p.N.length) : leafCost(p.N.length));
                                return { p: p, h: h };
                            }).sort(function (a, b) { return a.h - b.h; })
                              .slice(0, keep).map(function (x) { return x.p; });
                        }
                        for (var i = 0; i < parts.length; i++) {
                            var b = branchCost(parts[i], e);
                            var cost = size + b.ry.cost + b.rn.cost;
                            if (!res || cost < res.cost - EPS || (cost < res.cost + EPS && b.depth < res.depth)) {
                                res = { cost: cost, depth: b.depth, k: parts[i].letters[0] };
                            }
                        }
                    }
                    // Parar aquí (lista de opciones) solo si compensa estrictamente
                    if (!mustSplit && (!res || leafCost(size) < res.cost - EPS)) {
                        res = { cost: leafCost(size), depth: 0, k: -1 };
                    }
                    if (!res) res = { cost: leafCost(size), depth: 0, k: -1 }; // sin letras separadoras
                    memo.set(id, res);
                    return res;
                }

                var nextId = 0;
                function leaf(S, e, forced) {
                    return { id: nextId++, S: S, e: e, letter: null, yes: null, no: null, forced: !!forced };
                }

                // Construye el árbol completo de decisión
                function build(S, e, mustSplit, forced) {
                    var r = best(S, e, mustSplit);
                    var node = leaf(S, e, forced);
                    if (r.k < 0) return node;
                    return fill(node, r.k);
                }

                function fill(node, k) {
                    var sp = split(node.S, k);
                    node.letter = String.fromCharCode(97 + k);
                    node.yes = build(sp.Y, node.e, false, false);
                    node.no = node.e > 0 ? build(sp.N, node.e - 1, false, false) : leaf(sp.N, 0, true);
                    return node;
                }

                // Letras alternativas ordenadas de mejor a peor para un nodo (incluye letras equivalentes)
                function rank(S, e) {
                    var cand = candidateMask(S), out = [];
                    for (var k = 0; k < 26; k++) {
                        if (!(cand >> k & 1)) continue;
                        var sp = split(S, k);
                        var ry = best(sp.Y, e, false);
                        var rn = e > 0 ? best(sp.N, e - 1, false) : { cost: leafCost(sp.N.length), depth: 0 };
                        out.push({ k: k, cost: S.length + ry.cost + rn.cost, depth: 1 + Math.max(ry.depth, rn.depth) });
                    }
                    out.sort(function (a, b) { return (a.cost - b.cost) || (a.depth - b.depth) || (a.k - b.k); });
                    return out.map(function (o) { return o.k; });
                }

                return {
                    words: words,
                    canSplit: function (S) { return candidateMask(S) !== 0; },
                    root: function (e) {
                        var all = words.map(function (_, i) { return i; });
                        return build(all, e, true, false);
                    },
                    expand: function (node) {          // abre una lista final y la divide mejor posible
                        var r = build(node.S, node.e, true, false);
                        node.letter = r.letter; node.yes = r.yes; node.no = r.no; node.forced = false;
                        return node;
                    },
                    retarget: function (node) {        // siguiente letra alternativa para un nodo ya abierto
                        var order = rank(node.S, node.e);
                        var cur = node.letter.charCodeAt(0) - 97;
                        var next = order[(order.indexOf(cur) + 1) % order.length];
                        return fill(node, next);
                    },
                    stats: function () { return { states: states }; }
                };
            }

            // Métricas de un árbol: preguntas (letras nombradas hasta la lista final) y opciones finales
            function metrics(root) {
                var total = 0, sumQ = 0, sumO = 0, maxQ = 0, maxO = 0;
                (function walk(node, depth) {
                    if (!node.letter) {
                        var m = node.S.length;
                        total += m; sumQ += depth * m; sumO += m * m;
                        if (depth > maxQ) maxQ = depth;
                        if (m > maxO) maxO = m;
                        return;
                    }
                    walk(node.yes, depth + 1);
                    walk(node.no, depth + 1);
                })(root, 0);
                return { avgQ: sumQ / total, maxQ: maxQ, avgO: sumO / total, maxO: maxO };
            }

            return { clean: clean, letterMask: letterMask, createSolver: createSolver, metrics: metrics, PRIORITY: PRIORITY };
        })();

        /* ============================================================
           ESTADO Y UTILIDADES
           ============================================================ */
        var lang = 'ES';
        var solver = null;      // resolvedor de la lista actual
        var root = null;        // árbol de decisión (datos, no DOM)
        var current = null;     // nodo actual durante el modo "Probar"
        var h2cPromise = null;
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function $(id) { return document.getElementById(id); }
        function dict() { return I18N[lang]; }
        function esc(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function setHidden(ids, hidden) {
            ids.split(' ').forEach(function (id) { $(id).classList.toggle('hidden', hidden); });
        }
        function scrollToEl(el) {
            var y = el.getBoundingClientRect().top + window.pageYOffset - 80;
            window.scrollTo({ top: y, behavior: reduceMotion ? 'auto' : 'smooth' });
        }

        // "a, b; c" / saltos de línea -> lista sin vacíos ni repetidos (ignora mayúsculas y tildes)
        function parseWords(raw) {
            var seen = Object.create(null), out = [];
            raw.split(/[,;\n]+/).forEach(function (w) {
                w = w.trim().replace(/\s+/g, ' ');
                if (!w) return;
                var key = Engine.clean(w).replace(/[^a-z0-9]/g, '') || w;
                if (seen[key]) return;
                seen[key] = true;
                out.push(w);
            });
            return out;
        }

        function wordsOf(node) {
            return node.S.map(function (i) { return solver.words[i]; });
        }

        /* ============================================================
           IDIOMA
           ============================================================ */
        function updateWordCounter() {
            var n = parseWords($('form').value).length;
            $('lbl-word-count').textContent = n + ' ' + (n === 1 ? dict().word1 : dict().words);
        }

        function updateLanguage(code) {
            lang = code;
            var d = dict();

            document.documentElement.lang = code.toLowerCase();
            $('title-text').innerHTML = 'CASANDRA <span class="text-grunge-amber amber-glow">// ' + code + '</span>';

            Array.prototype.forEach.call(document.querySelectorAll('#language span'), function (el) {
                var on = el.dataset.lang === code;
                el.classList.toggle('text-gray-500', !on);
                ['sel', 'text-grunge-amber', 'font-bold', 'bg-grunge-card'].forEach(function (c) { el.classList.toggle(c, on); });
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
                el.textContent = d[el.dataset.i18n];
            });
            Array.prototype.forEach.call(document.querySelectorAll('.preset'), function (el) {
                el.value = d[el.dataset.p];
            });
            Array.prototype.forEach.call($('prio').options, function (o) { o.textContent = d['prio_' + o.value]; });

            $('form').placeholder = d.placeholder;
            $('form').value = '';
            $('submit').value = d.submit;
            $('test').value = d.test;
            $('save').value = d.save;
            $('yes').value = d.yes;
            $('no').value = d.no;
            $('retest').value = d.retest;
            $('goback').value = d.goback;

            solver = root = current = null;
            setHidden('result testsave text yesno retestgoback', true);
            updateWordCounter();
        }

        /* ============================================================
           RENDER DEL ÁRBOL (mismas clases/estructura visual que antes)
           ============================================================ */
        function renderNode(node, side) {
            var el = document.createElement('div');
            el.className = side === 'no' ? 'grp1' : 'grp2';
            el._node = node;

            if (!node.letter) {                                   // hoja: lista final de palabras
                el.classList.add('leaf');
                if (solver.canSplit(node.S)) el.classList.add('expandable');
                var span = document.createElement('span');
                span.textContent = wordsOf(node).join(', ');
                el.appendChild(span);
                return el;
            }

            el.classList.add('open');                             // nodo con letra: [letra][no][sí]
            var tile = document.createElement('div');
            tile.className = 'grp0';
            tile.textContent = node.letter.toUpperCase();
            el.appendChild(tile);
            el.appendChild(renderNode(node.no, 'no'));
            el.appendChild(renderNode(node.yes, 'yes'));
            return el;
        }

        function renderStats() {
            var m = Engine.metrics(root), d = dict();
            var f = function (x) { return String(+x.toFixed(1)); };
            $('stat-q').textContent = d.statQ + ': ' + f(m.avgQ) + ' ' + d.avg + ' / ' + m.maxQ + ' ' + d.max;
            $('stat-o').textContent = d.statO + ': ' + f(m.avgO) + ' ' + d.avg + ' / ' + m.maxO + ' ' + d.max;
        }

        function draw() {
            $('result').replaceChildren(renderNode(root, 'yes'));
            renderStats();
        }

        /* ============================================================
           GENERAR
           ============================================================ */
        function generate() {
            var d = dict();
            var words = parseWords($('form').value);

            if (words.length < 2) { alert(d.alert01); return; }

            var s = Engine.createSolver(words, Engine.PRIORITY[$('prio').value]);
            if (!s.canSplit(words.map(function (_, i) { return i; }))) { alert(d.alert02); return; }

            solver = s;
            root = s.root(parseInt($('nonumb').value, 10) - 1);
            current = null;
            draw();

            setHidden('result testsave', false);
            setHidden('text yesno retestgoback', true);
            scrollToEl($('result'));

            // Precarga la librería de la imagen cuando el navegador esté libre
            (window.requestIdleCallback || function (fn) { return setTimeout(fn, 1500); })(function () {
                loadHtml2Canvas().catch(function () {});
            });
        }

        // Clic en una letra: siguiente letra alternativa. Clic en una lista: dividirla.
        function onTreeClick(e) {
            var tile = e.target.closest('.grp0'), box;
            if (tile) {
                box = tile.parentNode;
                solver.retarget(box._node);
            } else {
                box = e.target.closest('.leaf.expandable');
                if (!box) return;
                solver.expand(box._node);
            }
            box.replaceWith(renderNode(box._node, box.classList.contains('grp1') ? 'no' : 'yes'));
            renderStats();
            setHidden('testsave', false);
            setHidden('text yesno', true);
        }

        /* ============================================================
           GUARDAR IMAGEN (html2canvas se descarga solo cuando hace falta)
           ============================================================ */
        function loadHtml2Canvas() {
            if (window.html2canvas) return Promise.resolve(window.html2canvas);
            if (!h2cPromise) {
                h2cPromise = new Promise(function (resolve, reject) {
                    var s = document.createElement('script');
                    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    s.onload = function () { resolve(window.html2canvas); };
                    s.onerror = function () { h2cPromise = null; reject(new Error('html2canvas')); };
                    document.head.appendChild(s);
                });
            }
            return h2cPromise;
        }

        function saveImage() {
            loadHtml2Canvas().then(function (html2canvas) {
                return html2canvas($('result'), {
                    backgroundColor: '#070709',
                    scale: Math.min(window.devicePixelRatio || 1, 2),
                    onclone: function (doc) {        // captura el esquema completo, no solo la parte visible
                        var r = doc.getElementById('result');
                        r.style.maxHeight = 'none';
                        r.style.overflow = 'visible';
                    }
                });
            }).then(function (canvas) {
                var a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'casandra-anagrama.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }).catch(function () { alert(dict().alert03); });
        }

        /* ============================================================
           MODO ENSAYO (guión en vivo, recorre el árbol)
           ============================================================ */
        function say(html) { $('script-display').innerHTML = html; }
        function big(letter) { return esc(letter.toUpperCase()); }

        function startTest() {
            if (!root) return;
            var d = dict();
            current = root;
            say(d.sent01a + big(root.letter) + d.sent01b);
            setHidden('result testsave retestgoback', true);
            setHidden('text yesno', false);
            scrollToEl($('text'));
        }

        function answer(yes) {
            if (!current || $('yesno').classList.contains('hidden')) return;
            var d = dict(), next = yes ? current.yes : current.no;

            if (next.letter) {                                   // aún quedan letras por nombrar
                current = next;
                say((yes ? d.sent02a : d.sent04a) + big(next.letter) + (yes ? d.sent02b : d.sent04b));
            } else {                                             // lista final de palabras
                var list = wordsOf(next).map(function (w) { return esc(w.toUpperCase()); }).join(d.sent00a);
                say((yes ? d.sent03a : d.sent05a) + list + (yes ? d.sent03b : d.sent05b));
                current = null;
                setHidden('yesno', true);
                setHidden('retestgoback', false);
            }
        }

        /* ============================================================
           PWA
           ============================================================ */
        function setupPWA() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function () {});
                });
            }
            var btn = $('pwa-install-btn'), deferred = null;
            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferred = e;
                btn.classList.remove('hidden');
            });
            btn.addEventListener('click', function () {
                if (!deferred) return;
                btn.classList.add('hidden');
                deferred.prompt();
                deferred = null;
            });
            window.addEventListener('appinstalled', function () { btn.classList.add('hidden'); });
        }

        /* ============================================================
           EVENTOS
           ============================================================ */
        $('form').addEventListener('input', updateWordCounter);
        $('language').addEventListener('click', function (e) {
            var el = e.target.closest('[data-lang]');
            if (el) updateLanguage(el.dataset.lang);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.preset'), function (btn) {
            btn.addEventListener('click', function () {
                $('form').value = dict()[btn.dataset.p + '_words'];
                updateWordCounter();
            });
        });
        $('submit').addEventListener('click', generate);
        $('result').addEventListener('click', onTreeClick);
        $('save').addEventListener('click', saveImage);
        $('test').addEventListener('click', startTest);
        $('retest').addEventListener('click', startTest);
        $('yes').addEventListener('click', function () { answer(true); });
        $('no').addEventListener('click', function () { answer(false); });
        $('goback').addEventListener('click', function () {
            setHidden('result testsave', false);
            setHidden('text retestgoback', true);
        });

        // Atajos de teclado en el modo ensayo
        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey || $('text').classList.contains('hidden')) return;
            var k = (e.key || '').toLowerCase();
            if (k === 'arrowright' || k === 's' || k === 'y') answer(true);
            else if (k === 'arrowleft' || k === 'n') answer(false);
        });

        updateLanguage('ES');
        setupPWA();
    })();
